[package]
name = "chainsaw_ffi"
version = "2.16.5"
edition = "2024"
license = "GPL3"

[lib]
crate-type = ["cdylib"]

[dependencies]
chainsaw = { path = ".." }
aho-corasick = "1.0"
anyhow = "1.0"
base64 = "0.23"
bytesize = "2.0"
chrono = "0.4"
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
hex = "0.4.3"
indicatif = "0.18"
rayon = "1.5"
regex = "1.6"
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = "0.9"
tau-engine = { version = "1.0", features = ["core", "json", "sync"] }
uuid = { version = "1.1", features = ["serde", "v4"] }
crossterm = "0.29"
tempfile = "3.2"
bincode = { version = "2.0", features = ["serde"] }
prettytable-rs = "0.10"
terminal_size = "0.4"
once_cell = "1.0"
lazy_static = "1.4.0"
quick-xml = { version = "0.41", features = ["serialize"] }
smallvec = "1.11"
